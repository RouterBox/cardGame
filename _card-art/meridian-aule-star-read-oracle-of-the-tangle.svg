<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1050" width="750" height="1050">
<title>Meridian Aule, Star-Read Oracle of the Tangle</title>
<rect class="frame-band" data-fount="Tangle" data-color="violet" x="0" y="0" width="750" height="1050" fill="#7c3aed"/>
<rect class="name-slot" x="24" y="24" width="702" height="70" fill="#f5f1e6"/>
<text x="40" y="69" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#14151a" font-weight="bold"><tspan x="40" dy="0">Meridian Aule, Star-Read Oracle of the Tangle</tspan></text>
<image class="art-window" x="24" y="94" width="702" height="420" href="https://cdn.leonardo.ai/users/7c12f74b-d49c-4a7e-8a6c-b9be0604d294/generations/a4894bba-1cf9-435a-8296-cee08e37ace3/Default_Trading_card_illustration_for_Meridian_Aule_StarRead_O_0.jpg" preserveAspectRatio="xMidYMid slice"/>
<rect class="type-line" x="24" y="514" width="702" height="50" fill="#e4dfd0"/>
<text x="40" y="546" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#3a3a3f"><tspan x="40" dy="0">Magic</tspan></text>
<rect class="rules-text-box" x="24" y="564" width="702" height="462" fill="#faf8f2" stroke="#c9ccd3" stroke-width="2"/>
<text x="40" y="596" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1c1c22"><tspan x="40" dy="0">Fast. When this resolves, look at the top</tspan><tspan x="40" dy="26">three cards of your Archive, then put them</tspan><tspan x="40" dy="26">back in any order.</tspan></text>
<text x="40" y="694" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#5a5d66" font-style="italic"><tspan x="40" dy="0">Meridian Aule reads the Tangle the way The</tspan><tspan x="40" dy="24">Starweave Communion always has: directly, at a</tspan><tspan x="40" dy="24">cost that lingers for days.</tspan></text>
<g class="cost-pip" data-fount="Tangle" data-color="violet">
<circle cx="682" cy="59" r="28" fill="#7c3aed" stroke="#14151a" stroke-width="3"/>
<text x="682" y="67" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold" fill="#14151a">2</text>
</g>
</svg>
