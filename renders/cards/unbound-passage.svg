<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1050" width="750" height="1050">
<title>Unbound Passage</title>
<rect class="frame-band" data-fount="Tangle" data-color="violet" x="0" y="0" width="750" height="1050" fill="#7c3aed"/>
<rect class="name-slot" x="24" y="24" width="702" height="70" fill="#f5f1e6"/>
<text x="40" y="69" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#14151a" font-weight="bold"><tspan x="40" dy="0">Unbound Passage</tspan></text>
<rect class="art-window" x="24" y="94" width="702" height="420" fill="#c9ccd3" stroke="#9a9da5" stroke-width="2"/>
<text x="375" y="304" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#5a5d66">Art Placeholder</text>
<rect class="type-line" x="24" y="514" width="702" height="50" fill="#e4dfd0"/>
<text x="40" y="546" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#3a3a3f"><tspan x="40" dy="0">Magic</tspan></text>
<rect class="rules-text-box" x="24" y="564" width="702" height="462" fill="#faf8f2" stroke="#c9ccd3" stroke-width="2"/>
<text x="40" y="596" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1c1c22"><tspan x="40" dy="0">Slow. When this resolves, choose a Wormhole:</tspan><tspan x="40" dy="26">until end of turn, your Assault (Section 8.6,</tspan><tspan x="40" dy="26">which defines Assault) may treat any</tspan><tspan x="40" dy="26">Directional Restriction or Team Restriction</tspan><tspan x="40" dy="26">that Wormhole carries (Section 8.4, which</tspan><tspan x="40" dy="26">defines Restriction) as absent, for the</tspan><tspan x="40" dy="26">purpose of counting that Assault&apos;s path.</tspan></text>
<text x="40" y="798" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#5a5d66" font-style="italic"><tspan x="40" dy="0">The Starweave Communion doesn&apos;t ask a Wormhole</tspan><tspan x="40" dy="24">for permission — the Tangle simply forgets,</tspan><tspan x="40" dy="24">for one crossing, that a rule was ever written</tspan><tspan x="40" dy="24">there.</tspan></text>
<g class="cost-pip" data-fount="Tangle" data-color="violet">
<circle cx="682" cy="59" r="28" fill="#7c3aed" stroke="#14151a" stroke-width="3"/>
<text x="682" y="67" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold" fill="#14151a">2</text>
</g>
</svg>
