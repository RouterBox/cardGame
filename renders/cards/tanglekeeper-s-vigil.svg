<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1050" width="750" height="1050">
<title>Tanglekeeper&apos;s Vigil</title>
<rect class="frame-band" data-fount="Tangle" data-color="violet" x="0" y="0" width="750" height="1050" fill="#7c3aed"/>
<rect class="name-slot" x="24" y="24" width="702" height="70" fill="#f5f1e6"/>
<text x="40" y="69" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#14151a" font-weight="bold"><tspan x="40" dy="0">Tanglekeeper&apos;s Vigil</tspan></text>
<rect class="art-window" x="24" y="94" width="702" height="420" fill="#c9ccd3" stroke="#9a9da5" stroke-width="2"/>
<text x="375" y="304" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#5a5d66">Art Placeholder</text>
<rect class="type-line" x="24" y="514" width="702" height="50" fill="#e4dfd0"/>
<text x="40" y="546" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#3a3a3f"><tspan x="40" dy="0">Magic</tspan></text>
<rect class="rules-text-box" x="24" y="564" width="702" height="462" fill="#faf8f2" stroke="#c9ccd3" stroke-width="2"/>
<text x="375" y="596" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1c1c22" text-anchor="middle"><tspan x="375" dy="0">Slow. When this resolves, if you have taken a Frontier</tspan><tspan x="375" dy="26">Discovery action this turn (Section 8.3, which defines</tspan><tspan x="375" dy="26">Frontier Discovery and Wormhole Length) whose Wormhole</tspan><tspan x="375" dy="26">Length was 3 or less and whose destination was Halvorne</tspan><tspan x="375" dy="26">Junction, look at the top card of your Archive; you may</tspan><tspan x="375" dy="26">put it on the bottom of your Archive instead of leaving it</tspan><tspan x="375" dy="26">on top.</tspan></text>
<text x="375" y="798" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#5a5d66" font-style="italic" text-anchor="middle"><tspan x="375" dy="0">The Starweave Communion doesn&apos;t garrison Halvorne Junction so</tspan><tspan x="375" dy="24">much as haunt it — every short, cheap wormhole that meets there</tspan><tspan x="375" dy="24">still answers to an oath sworn during the Cinderglass War.</tspan></text>
<g class="cost-pip" data-fount="Tangle" data-color="violet">
<circle cx="682" cy="59" r="28" fill="#7c3aed" stroke="#14151a" stroke-width="3"/>
<text x="682" y="67" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold" fill="#14151a">2</text>
</g>
</svg>
