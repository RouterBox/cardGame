<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1050" width="750" height="1050">
<title>Tallowfen Chokepoint Works</title>
<rect class="frame-band" data-fount="Circuit" data-color="copper" x="0" y="0" width="750" height="1050" fill="#b5651d"/>
<rect class="name-slot" x="24" y="24" width="702" height="70" fill="#f5f1e6"/>
<text x="40" y="69" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#14151a" font-weight="bold"><tspan x="40" dy="0">Tallowfen Chokepoint Works</tspan></text>
<rect class="art-window" x="24" y="94" width="702" height="420" fill="#c9ccd3" stroke="#9a9da5" stroke-width="2"/>
<text x="375" y="304" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#5a5d66">Art Placeholder</text>
<rect class="type-line" x="24" y="514" width="702" height="50" fill="#e4dfd0"/>
<text x="40" y="546" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#3a3a3f"><tspan x="40" dy="0">Technology — Permanent</tspan></text>
<rect class="rules-text-box" x="24" y="564" width="702" height="462" fill="#faf8f2" stroke="#c9ccd3" stroke-width="2"/>
<text x="375" y="596" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1c1c22" text-anchor="middle"><tspan x="375" dy="0">Slow. This permanent is a Generator attuned to the</tspan><tspan x="375" dy="26">Circuit: during the Generation Phase, it produces 1</tspan><tspan x="375" dy="26">Circuit Point, added to its controller&apos;s Circuit resource</tspan><tspan x="375" dy="26">pool. Spent: if you have taken an Assault action this turn</tspan><tspan x="375" dy="26">that resulted in a Blockade (Section 8.6, which defines</tspan><tspan x="375" dy="26">Blockade) of Tallowfen, create an exact token copy of this</tspan><tspan x="375" dy="26">permanent, put directly onto the Field under your control.</tspan></text>
<text x="375" y="798" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#5a5d66" font-style="italic" text-anchor="middle"><tspan x="375" dy="0">Tallowfen has nothing worth keeping except the one wormhole</tspan><tspan x="375" dy="24">running through it, and the Wrought Assembly has learned the</tspan><tspan x="375" dy="24">same lesson every other fleet learns there: hold the chokepoint</tspan><tspan x="375" dy="24">only as long as you can spare the ships.</tspan></text>
<g class="cost-pip" data-fount="Circuit" data-color="copper">
<circle cx="682" cy="59" r="28" fill="#b5651d" stroke="#14151a" stroke-width="3"/>
<text x="682" y="67" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold" fill="#14151a">2</text>
</g>
</svg>
