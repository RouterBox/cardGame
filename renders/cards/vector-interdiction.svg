<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1050" width="750" height="1050">
<title>Vector Interdiction</title>
<rect class="frame-band" data-fount="Signal" data-color="cyan" x="0" y="0" width="750" height="1050" fill="#06b6d4"/>
<rect class="name-slot" x="24" y="24" width="702" height="70" fill="#f5f1e6"/>
<text x="40" y="69" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#14151a" font-weight="bold"><tspan x="40" dy="0">Vector Interdiction</tspan></text>
<rect class="art-window" x="24" y="94" width="702" height="420" fill="#c9ccd3" stroke="#9a9da5" stroke-width="2"/>
<text x="375" y="304" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#5a5d66">Art Placeholder</text>
<rect class="type-line" x="24" y="514" width="702" height="50" fill="#e4dfd0"/>
<text x="40" y="546" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#3a3a3f"><tspan x="40" dy="0">Intelligence</tspan></text>
<rect class="rules-text-box" x="24" y="564" width="702" height="462" fill="#faf8f2" stroke="#c9ccd3" stroke-width="2"/>
<text x="40" y="596" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1c1c22"><tspan x="40" dy="0">Fast. When this resolves, choose a Wormhole</tspan><tspan x="40" dy="26">with an endpoint at a Planet you control;</tspan><tspan x="40" dy="26">place a Team Restriction (Section 8.4, which</tspan><tspan x="40" dy="26">defines Restriction) on it naming yourself, so</tspan><tspan x="40" dy="26">the opposing challenger&apos;s Assaults may not</tspan><tspan x="40" dy="26">count it as part of a path.</tspan></text>
<text x="40" y="772" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#5a5d66" font-style="italic"><tspan x="40" dy="0">The Panoptic Concord doesn&apos;t need to fight for</tspan><tspan x="40" dy="24">a route once it already knows which route</tspan><tspan x="40" dy="24">matters — it simply writes its own name on the</tspan><tspan x="40" dy="24">manifest and every rival Assault stops reading</tspan><tspan x="40" dy="24">past that line.</tspan></text>
<g class="cost-pip" data-fount="Signal" data-color="cyan">
<circle cx="682" cy="59" r="28" fill="#06b6d4" stroke="#14151a" stroke-width="3"/>
<text x="682" y="67" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold" fill="#14151a">1</text>
</g>
</svg>
