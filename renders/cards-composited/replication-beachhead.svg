<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1050" width="750" height="1050">
<title>Replication Beachhead</title>
<rect class="frame-band" data-fount="Circuit" data-color="copper" x="0" y="0" width="750" height="1050" fill="#b5651d"/>
<rect class="name-slot" x="24" y="24" width="702" height="70" fill="#f5f1e6"/>
<text x="40" y="69" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#14151a" font-weight="bold"><tspan x="40" dy="0">Replication Beachhead</tspan></text>
<image class="art-window" x="24" y="94" width="702" height="420" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid slice"/>
<rect class="type-line" x="24" y="514" width="702" height="50" fill="#e4dfd0"/>
<text x="40" y="546" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#3a3a3f"><tspan x="40" dy="0">Technology — Permanent</tspan></text>
<rect class="rules-text-box" x="24" y="564" width="702" height="462" fill="#faf8f2" stroke="#c9ccd3" stroke-width="2"/>
<text x="40" y="596" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1c1c22"><tspan x="40" dy="0">Slow. This permanent is a Generator attuned to</tspan><tspan x="40" dy="26">the Circuit: during the Generation Phase, it</tspan><tspan x="40" dy="26">produces 1 Circuit Point, added to its</tspan><tspan x="40" dy="26">controller&apos;s Circuit resource pool. Spent: if</tspan><tspan x="40" dy="26">you have taken an Assault action this turn</tspan><tspan x="40" dy="26">that resulted in a Capture (Section 8.6, which</tspan><tspan x="40" dy="26">defines Assault and Capture), create an exact</tspan><tspan x="40" dy="26">token copy of this permanent, put directly</tspan><tspan x="40" dy="26">onto the Field under your control.</tspan></text>
<text x="40" y="850" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#5a5d66" font-style="italic"><tspan x="40" dy="0">The Wrought Assembly, Technology as</tspan><tspan x="40" dy="24">inevitability: the instant a Capture lands,</tspan><tspan x="40" dy="24">the design that took the Planet is already</tspan><tspan x="40" dy="24">copying itself onto it.</tspan></text>
<g class="cost-pip" data-fount="Circuit" data-color="copper">
<circle cx="682" cy="59" r="28" fill="#b5651d" stroke="#14151a" stroke-width="3"/>
<text x="682" y="67" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold" fill="#14151a">2</text>
</g>
</svg>
