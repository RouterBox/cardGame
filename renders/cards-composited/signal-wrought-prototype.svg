<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1050" width="750" height="1050">
<title>Signal-Wrought Prototype</title>
<rect class="frame-band" data-fount="Signal" data-color="cyan" x="0" y="0" width="375" height="1050" fill="#06b6d4"/>
<rect class="frame-band" data-fount="Circuit" data-color="copper" x="375" y="0" width="375" height="1050" fill="#b5651d"/>
<rect class="name-slot" x="24" y="24" width="702" height="70" fill="#f5f1e6"/>
<text x="40" y="69" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#14151a" font-weight="bold"><tspan x="40" dy="0">Signal-Wrought Prototype</tspan></text>
<image class="art-window" x="24" y="94" width="702" height="420" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid slice"/>
<rect class="type-line" x="24" y="514" width="702" height="50" fill="#e4dfd0"/>
<text x="40" y="546" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#3a3a3f"><tspan x="40" dy="0">Intelligence Technology — Permanent</tspan></text>
<rect class="rules-text-box" x="24" y="564" width="702" height="462" fill="#faf8f2" stroke="#c9ccd3" stroke-width="2"/>
<text x="40" y="596" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1c1c22"><tspan x="40" dy="0">Slow. Spent, usable at instant speed (any time</tspan><tspan x="40" dy="26">its controller holds priority): look at the</tspan><tspan x="40" dy="26">top card of your Archive; you may move it to</tspan><tspan x="40" dy="26">the bottom of your Archive instead of leaving</tspan><tspan x="40" dy="26">it on top.</tspan></text>
<text x="40" y="746" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#5a5d66" font-style="italic"><tspan x="40" dy="0">The Panoptic Concord doesn&apos;t choose between</tspan><tspan x="40" dy="24">knowing and building. It never has to.</tspan></text>
<g class="cost-pip" data-fount="Signal" data-color="cyan">
<circle cx="616" cy="59" r="28" fill="#06b6d4" stroke="#14151a" stroke-width="3"/>
<text x="616" y="67" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold" fill="#14151a">1</text>
</g>
<g class="cost-pip" data-fount="Circuit" data-color="copper">
<circle cx="682" cy="59" r="28" fill="#b5651d" stroke="#14151a" stroke-width="3"/>
<text x="682" y="67" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold" fill="#14151a">1</text>
</g>
</svg>
