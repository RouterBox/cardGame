<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1050" width="750" height="1050">
<title>Rite of Unmaking</title>
<rect class="frame-band" data-fount="Tangle" data-color="violet" x="0" y="0" width="750" height="1050" fill="#7c3aed"/>
<rect class="name-slot" x="24" y="24" width="702" height="70" fill="#f5f1e6"/>
<text x="40" y="69" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#14151a" font-weight="bold"><tspan x="40" dy="0">Rite of Unmaking</tspan></text>
<image class="art-window" x="24" y="94" width="702" height="420" href="https://cdn.leonardo.ai/gen-1/image-0.png" preserveAspectRatio="xMidYMid slice"/>
<rect class="type-line" x="24" y="514" width="702" height="50" fill="#e4dfd0"/>
<text x="40" y="546" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#3a3a3f"><tspan x="40" dy="0">Magic</tspan></text>
<rect class="rules-text-box" x="24" y="564" width="702" height="462" fill="#faf8f2" stroke="#c9ccd3" stroke-width="2"/>
<text x="40" y="596" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1c1c22"><tspan x="40" dy="0">Slow. When this resolves, choose a Wormhole</tspan><tspan x="40" dy="26">with an endpoint at a Planet you control: it</tspan><tspan x="40" dy="26">undergoes Closure (Section 8.5, which defines</tspan><tspan x="40" dy="26">Closure) and is removed from the battlefield</tspan><tspan x="40" dy="26">graph.</tspan></text>
<text x="40" y="746" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#5a5d66" font-style="italic"><tspan x="40" dy="0">The Starweave Communion calls this a mercy:</tspan><tspan x="40" dy="24">some paths through the Tangle were never meant</tspan><tspan x="40" dy="24">to stay open, and Closure just makes that true</tspan><tspan x="40" dy="24">again.</tspan></text>
<g class="cost-pip" data-fount="Tangle" data-color="violet">
<circle cx="682" cy="59" r="28" fill="#7c3aed" stroke="#14151a" stroke-width="3"/>
<text x="682" y="67" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold" fill="#14151a">2</text>
</g>
</svg>
