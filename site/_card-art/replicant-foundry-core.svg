<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1050" width="750" height="1050">
<title>Replicant Foundry Core</title>
<rect class="frame-band" data-fount="Circuit" data-color="copper" x="0" y="0" width="750" height="1050" fill="#b5651d"/>
<rect class="name-slot" x="24" y="24" width="702" height="70" fill="#f5f1e6"/>
<text x="40" y="69" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#14151a" font-weight="bold"><tspan x="40" dy="0">Replicant Foundry Core</tspan></text>
<image class="art-window" x="24" y="94" width="702" height="420" href="https://cdn.leonardo.ai/users/7c12f74b-d49c-4a7e-8a6c-b9be0604d294/generations/f782b426-ec74-4381-9190-6be394f20ffe/Default_Trading_card_illustration_for_Replicant_Foundry_Core_P_0.jpg" preserveAspectRatio="xMidYMid slice"/>
<rect class="type-line" x="24" y="514" width="702" height="50" fill="#e4dfd0"/>
<text x="40" y="546" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#3a3a3f"><tspan x="40" dy="0">Technology — Permanent</tspan></text>
<rect class="rules-text-box" x="24" y="564" width="702" height="462" fill="#faf8f2" stroke="#c9ccd3" stroke-width="2"/>
<text x="40" y="596" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1c1c22"><tspan x="40" dy="0">Slow. This permanent is a Generator attuned to</tspan><tspan x="40" dy="26">the Circuit: during the Generation Phase, it</tspan><tspan x="40" dy="26">produces 1 Circuit Point, added to its</tspan><tspan x="40" dy="26">controller&apos;s Circuit resource pool. Spent:</tspan><tspan x="40" dy="26">create an exact token copy of this permanent,</tspan><tspan x="40" dy="26">put directly onto the Field under your</tspan><tspan x="40" dy="26">control.</tspan></text>
<text x="40" y="798" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#5a5d66" font-style="italic"><tspan x="40" dy="0">The Wrought Assembly&apos;s whole civilization is</tspan><tspan x="40" dy="24">one argument, repeated: find the single</tspan><tspan x="40" dy="24">flawless design, then let Technology do what</tspan><tspan x="40" dy="24">it does best and copy it without end.</tspan></text>
<g class="cost-pip" data-fount="Circuit" data-color="copper">
<circle cx="682" cy="59" r="28" fill="#b5651d" stroke="#14151a" stroke-width="3"/>
<text x="682" y="67" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold" fill="#14151a">3</text>
</g>
</svg>
