<text x="40" y="546" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#3a3a3f"><tspan x="40" dy="0">Intelligence</tspan></text>
<rect class="rules-text-box" x="24" y="564" width="702" height="462" fill="#faf8f2" stroke="#c9ccd3" stroke-width="2"/>
<text x="40" y="596" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1c1c22"><tspan x="40" dy="0">Fast. When this resolves, look at an</tspan><tspan x="40" dy="26">opponent&apos;s Hand; then draw a card.</tspan></text>
<text x="40" y="668" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#5a5d66" font-style="italic"><tspan x="40" dy="0">Selin Vashti Corr trades in The Panoptic</tspan><tspan x="40" dy="24">Concord&apos;s oldest currency: things people would</tspan><tspan x="40" dy="24">rather she didn&apos;t know.</tspan></text>
