<image class="art-window" x="24" y="94" width="702" height="420" href="https://cdn.leonardo.ai/users/7c12f74b-d49c-4a7e-8a6c-b9be0604d294/generations/bfe05261-6e97-422d-b1d7-5ea55600a07e/Default_Trading_card_illustration_for_Selin_Vashti_Corr_Whispe_0.jpg" preserveAspectRatio="xMidYMid slice"/>
