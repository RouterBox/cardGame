<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1050" width="750" height="1050">
<title>Communion Waystone</title>
<rect class="frame-band" data-fount="Tangle" data-color="violet" x="0" y="0" width="375" height="1050" fill="#7c3aed"/>
<rect class="frame-band" data-fount="Mass" data-color="ash-grey" x="375" y="0" width="375" height="1050" fill="#8a8d93"/>
<rect class="name-slot" x="24" y="24" width="702" height="70" fill="#f5f1e6"/>
<text x="40" y="69" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#14151a" font-weight="bold"><tspan x="40" dy="0">Communion Waystone</tspan></text>
<image class="art-window" x="24" y="94" width="702" height="420" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid slice"/>
<rect class="type-line" x="24" y="514" width="702" height="50" fill="#e4dfd0"/>
<text x="40" y="546" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#3a3a3f"><tspan x="40" dy="0">Magic Materials — Permanent</tspan></text>
<rect class="rules-text-box" x="24" y="564" width="702" height="462" fill="#faf8f2" stroke="#c9ccd3" stroke-width="2"/>
<text x="375" y="596" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1c1c22" text-anchor="middle"><tspan x="375" dy="0">Slow. This permanent is a Generator attuned to the Tangle:</tspan><tspan x="375" dy="26">during the Generation Phase (Section 5.2), it produces 1</tspan><tspan x="375" dy="26">Tangle Point, added to its controller&apos;s Tangle resource</tspan><tspan x="375" dy="26">pool.</tspan></text>
<text x="375" y="720" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#5a5d66" font-style="italic" text-anchor="middle"><tspan x="375" dy="0">The Starweave Communion raises a Waystone wherever the Tangle</tspan><tspan x="375" dy="24">runs close enough to the surface to be petitioned — and the</tspan><tspan x="375" dy="24">First Weave, unasked, answers anyway.</tspan></text>
<g class="cost-pip" data-fount="Tangle" data-color="violet">
<circle cx="616" cy="59" r="28" fill="#7c3aed" stroke="#14151a" stroke-width="3"/>
<text x="616" y="67" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold" fill="#14151a">1</text>
</g>
<g class="cost-pip" data-fount="Mass" data-color="ash-grey">
<circle cx="682" cy="59" r="28" fill="#8a8d93" stroke="#14151a" stroke-width="3"/>
<text x="682" y="67" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold" fill="#14151a">1</text>
</g>
</svg>
